[project]
name = "shophelp-agent"
version = "0.1.0"
description = "Customer support agent for a fictional shop, evaluated on tau-bench retail"
authors = [
    { name = "Muhammed Elgenead Hago", email = "muhammed.elgenead.hago.766@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "langgraph>=1.2.24",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.29.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
